name: Release

on:
  push:
    tags:
      - 'v[0-9]*.[0-9]*.[0-9]*'

jobs:
  release:
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5

      - name: Extract version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_ENV

      - name: Build
        run: swift build -c release

      - name: Import signing identity
        env:
          CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_SIGNING_CERTIFICATE_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_SIGNING_CERTIFICATE_PASSWORD }}
        run: |
          CERTIFICATE_PATH="$RUNNER_TEMP/xbridge-signing.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/xbridge-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 32)"
          echo "::add-mask::$KEYCHAIN_PASSWORD"
          printf '%s' "$CERTIFICATE_P12_BASE64" | base64 --decode > "$CERTIFICATE_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "$CERTIFICATE_PASSWORD" -k "$KEYCHAIN_PATH" -f pkcs12 -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"

      - name: Package
        run: |
          rm -rf /tmp/xbridge-bin
          mkdir /tmp/xbridge-bin
          cp .build/release/xbridge .build/release/xbridged /tmp/xbridge-bin/
          for binary in xbridge xbridged; do
            codesign --force --sign "Developer ID Application: Four Rays AB (RGS98ZRDY6)" \
              --keychain "$RUNNER_TEMP/xbridge-signing.keychain-db" \
              --identifier "net.4rays.$binary" --options runtime --timestamp \
              "/tmp/xbridge-bin/$binary"
            codesign --verify --strict --verbose=2 "/tmp/xbridge-bin/$binary"
            codesign -dv --verbose=4 "/tmp/xbridge-bin/$binary"
          done
          install -m 644 skills/xbridge/SKILL.md /tmp/xbridge-bin/xbridge-skill.md
          cd /tmp
          tar -czf xbridge-${VERSION}-macos.tar.gz xbridge-bin/
          echo "SHA256=$(shasum -a 256 xbridge-${VERSION}-macos.tar.gz | awk '{print $1}')" >> $GITHUB_ENV

      - name: Remove signing credentials
        if: ${{ always() }}
        run: |
          rm -f "$RUNNER_TEMP/xbridge-signing.p12"
          if [[ -f "$RUNNER_TEMP/xbridge-signing.keychain-db" ]]; then
            security delete-keychain "$RUNNER_TEMP/xbridge-signing.keychain-db"
          fi

      - name: Verify bundled skill
        run: |
          mkdir -p /tmp/xbridge-check/bin /tmp/xbridge-check/share/xbridge
          cp /tmp/xbridge-bin/xbridge /tmp/xbridge-check/bin/
          cp /tmp/xbridge-bin/xbridge-skill.md /tmp/xbridge-check/share/xbridge/
          /tmp/xbridge-check/bin/xbridge skill | cmp - skills/xbridge/SKILL.md

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create ${{ github.ref_name }} \
            --title "${{ github.ref_name }}" \
            --generate-notes \
            --latest
          gh release upload ${{ github.ref_name }} /tmp/xbridge-${VERSION}-macos.tar.gz

      - name: Update Homebrew formula
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          git clone https://x-access-token:${GH_TOKEN}@github.com/4rays/homebrew-tap.git /tmp/homebrew-tap
          cd /tmp/homebrew-tap
          sed -i '' \
            -e "s|releases/download/v[0-9.]*/xbridge-[0-9.]*-macos\.tar\.gz|releases/download/${{ github.ref_name }}/xbridge-${VERSION}-macos.tar.gz|" \
            -e "s|sha256 \"[a-f0-9]*\"|sha256 \"${SHA256}\"|" \
            -e "s|version \"[0-9.]*\"|version \"${VERSION}\"|" \
            Formula/xbridge.rb
          ruby -e 'p = "Formula/xbridge.rb"; s = File.read(p); s = s.lines.reject { |line| line.include?(%q{bin.install "xbridge-allow"}) }.join; unless s.include?(%q{pkgshare.install "xbridge-skill.md"}); abort "missing xbridged install" unless s.include?(%q{    bin.install "xbridged"}); s = s.sub(%q{    bin.install "xbridged"}, %Q{    bin.install "xbridged"\n    pkgshare.install "xbridge-skill.md"}); end; File.write(p, s)'
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/xbridge.rb
          git commit -m "Update xbridge to ${VERSION}"
          git push
